": "다수 집단 AI 신호 조건 포함"}, {"t": "속성별 분석", "d": "인종, 연령, 성적 지향, 자폐 공개"}, {"t": "채용 이후", "d": "배치와 승진 단계"}]}, {"t": "pts", "k": "생각해 볼 질문 · 해설", "h": "토론해 봅시다", "steps": [{"t": "내 이력서", "d": "AI 기술을 어떻게 표시할까"}, {"t": "공정성", "d": "역량 개발과 차별 시정은 왜 함께 가야 할까"}, {"t": "기업 입장", "d": "평가 과정을 어떻게 감사할까"}], "note": "정답이 없는 질문입니다. 논문의 결론을 넘어서는 생각을 해 보세요."}, {"t": "src", "ref": "Drydakis, N. (2026). Artificial intelligence-related digital skills and employment outcomes for underrepresented women (IZA Discussion Paper No. 18964). https://docs.iza.org/dp18964.pdf", "status": "동료심사 전 디스커션페이퍼. 채용 초기 단계의 실험 결과입니다.", "post": "https://donghunc.kr/?p=984"}]};</script><script>(()=>{
'use strict';
const D=window.DECK,$=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];

function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

/* ---- illustrations ---- */
function pict(s){return `<div class="pgs">${s.groups.map((g,gi)=>{
  const cols=g.cols,rows=Math.ceil(g.total/cols),c=10,r=3.6,id=`gr${SI}_${gi}`,step=Math.min(45,1200/Math.max(1,g.on));
  let dots='',hi='',defs='';
  for(let n=0;n<g.total;n++){const x=(n%cols)*c+c/2,y=Math.floor(n/cols)*c+c/2,d=Math.round(n*step);
    if(n+1<=Math.floor(g.on))hi+=`<circle cx="${x}" cy="${y}" r="${r+.5}" fill="var(--ac)" style="--d:${d}"/>`;
    else if(n<g.on){const f=(g.on-n).toFixed(3);defs=`<linearGradient id="${id}"><stop offset="${f}" stop-color="var(--ac)"/><stop offset="${f}" stop-color="var(--ln)"/></linearGradient>`;hi+=`<circle cx="${x}" cy="${y}" r="${r+.5}" fill="url(#${id})" style="--d:${d}"/>`}
    else dots+=`<circle cx="${x}" cy="${y}" r="${r}"/>`}
  return `<div class="pg r" style="--i:${gi+1}"><svg viewBox="0 0 ${cols*c} ${rows*c}" role="img" aria-label="${esc(g.label)}"><defs>${defs}</defs><g class="dg" fill="var(--ln)">${dots}</g><g class="hi">${hi}</g></svg><div class="pc"><b class="pn">${esc(g.label)}</b><span>${esc(g.cap||'')}</span></div></div>`}).join('')}</div>`}
function branch(s){return `<div class="bz">${R(esc(s.root),0,'div','rt')}<svg viewBox="0 0 200 100" aria-hidden="true">${s.br.map((b,i)=>{const n=s.br.length,x=n===1?100:30+140*i/(n-1);return `<path d="M100 4 C 100 54, ${x} 46, ${x} 96" stroke="${b.c||'var(--ac)'}" stroke-width="${b.w}" pathLength="1" style="--i:${i}"/>`}).join('')}</svg><div class="lv" style="grid-template-columns:repeat(${s.br.length},1fr)">${s.br.map((b,i)=>R(`<b>${esc(b.l)}</b><span>${esc(b.sub||'')}</span>`,i+3)).join('')}</div></div>`}
function scale(s){const[l,rr]=s.sides;return `<div class="sc2"><svg viewBox="0 0 200 110" aria-hidden="true"><path d="M100 30 L88 100 L112 100 Z" fill="var(--ln)"/><g class="beam" style="--tilt:${s.tilt||-8}deg"><line x1="20" y1="30" x2="180" y2="30" stroke="var(--fg)" stroke-width="3" stroke-linecap="round"/><path d="M20 30 L8 62 M20 30 L32 62 M180 30 L168 62 M180 30 L192 62" stroke="var(--fg2)" stroke-width="1.2" fill="none"/><path d="M4 62 Q20 76 36 62 Z" fill="var(--ac)"/><path d="M164 62 Q180 76 196 62 Z" fill="var(--ac2)"/></g></svg><div class="lv">${R(`<b>${esc(l.l)}</b><span>${esc(l.sub)}</span>`,1)}${R(`<b>${esc(rr.l)}</b><span>${esc(rr.sub)}</span>`,2)}</div></div>`}
function timeline(s){return `<div class="tl"><div class="tln r" style="--i:0"><i></i></div><ol>${s.pts.map((p,i)=>`<li class="r" style="--i:${i+1}"><span class="dt"></span><b>${esc(p.l)}</b></li>`).join('')}</ol></div>`}
function eye(s){const mk=(spread,n,seed,rad,label,gi)=>{const f=rng(seed);let pts=[],pl='',dots='';
  for(let k=0;k<n;k++){const a=f()*6.283,d=Math.sqrt(f())*spread,x=Math.max(20,Math.min(180,100+Math.cos(a)*d)),y=Math.max(24,Math.min(176,92+Math.sin(a)*d*1.1));pts.push([x,y])}
  pl=pts.map(p=>p.map(v=>v.toFixed(1)).join(',')).join(' ');
  dots=pts.map((p,k)=>`<circle class="fx" cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${rad}" fill="var(--ac)" fill-opacity=".85" style="--d:${k*150}"/>`).join('');
  return `<div class="ey r" style="--i:${gi+1}"><svg viewBox="0 0 200 200" role="img" aria-label="${esc(label)}"><rect x="2" y="2" width="196" height="196" rx="18" fill="var(--tr)" stroke="var(--ln)"/><circle cx="100" cy="82" r="34" fill="none" stroke="var(--ln)" stroke-width="2"/><path d="M40 190 Q100 118 160 190" fill="none" stroke="var(--ln)" stroke-width="2"/><polyline class="sp" points="${pl}" pathLength="1" fill="none" stroke="var(--ac)" stroke-width="1.6" stroke-opacity=".7"/>${dots}</svg><b>${esc(label)}</b></div>`};
  return `<div class="eyes">${mk(26,7,3,4,s.a,0)}${mk(78,12,9,7,s.b,1)}</div>`}
function shift(s){return `<div class="sh">${s.items.map((it,i)=>`<div class="shc r" style="--i:${i+1}"><div class="sht"><div class="gh" style="height:${it.f}%"></div><div class="nw" style="--f:${it.f}%;--t:${it.t}%;--c:${it.c==='ac2'?'var(--ac2)':'var(--ac)'}"></div></div><b>${esc(it.l)}</b></div>`).join('')}</div>`}
function stairs(s){const n=s.steps.length;return `<div class="st">${s.steps.map((p,i)=>`<div class="stp r" style="--i:${i+1};--h:${36+i*(60/Math.max(1,n-1))}%">${esc(p.l)}</div>`).join('')}</div>`}
function loop(s){const n=s.nodes.length,cx=320,cy=180,rx=215,ry=130;
  const path=`M${cx-rx} ${cy} a${rx} ${ry} 0 1 1 ${2*rx} 0 a${rx} ${ry} 0 1 1 ${-2*rx} 0`;
  const nodes=s.nodes.map((t,k)=>{const a=(-90+k*360/n)*Math.PI/180,x=cx+rx*Math.cos(a),y=cy+ry*Math.sin(a);
    const sp=[...t].map((c,j)=>c===' '?j:-1).filter(j=>j>=0).sort((a,b)=>Math.abs(a-t.length/2)-Math.abs(b-t.length/2))[0],parts=t.length>7&&sp!==undefined?[t.slice(0,sp),t.slice(sp+1)]:[t];
    const tx=parts.map((p,j)=>`<tspan x="${x.toFixed(1)}" dy="${j?22:(parts.length>1?-2:7)}">${esc(p)}</tspan>`).join('');
    return `<g class="nd" style="--d:${k*350}"><rect x="${(x-85).toFixed(1)}" y="${(y-30).toFixed(1)}" width="170" height="60" rx="16" fill="var(--tr)" stroke="${k===s.hl?'var(--ac)':'var(--ln)'}" stroke-width="${k===s.hl?2:1}"/><text x="${x.toFixed(1)}" y="${(y-(parts.length>1?8:0)).toFixed(1)}" fill="var(--fg)" font-size="19" font-weight="600" text-anchor="middle">${tx}</text></g>`}).join('');
  return `<div class="lp"><svg viewBox="0 0 640 360" role="img" aria-label="${esc(s.nodes.join(' → '))}"><path class="rg" d="${path}" pathLength="1" fill="none" stroke="var(--ln)" stroke-width="2"/>${nodes}<circle r="6" fill="var(--ac)"><animateMotion dur="9s" repeatCount="indefinite" path="${path}"/></circle></svg></div>`}
const ILL={pict,branch,scale,timeline,eye,shift,stairs,loop};

/* ---- slide types ---- */
const T={
 title:s=>`<div class="in c">${kick(s,0)}<h1>${words(s.h,1)}</h1>${s.sub?R(esc(s.sub),6,'p','sub'):''}${s.badge?R(`<span class="pill">${esc(s.badge)}</span>`,7):''}</div>`,

 num:s=>`<div class="in c">${kick(s,0)}${R(`<span class="big" data-to="${s.n}" data-dec="${s.dec||0}" data-pre="${esc(s.pre||'')}">${esc(s.pre||'')}${s.n}</span><span class="unit">${esc(s.unit||'')}</span>`,1)}${R(esc(s.label),2,'p','sub')}${s.note?R(esc(s.note),3,'p','note'):''}</div>`,
 bars:s=>`<div class="in">${kick(s,0)}${s.h?R(esc(s.h),0,'h3'):''}<div class="bars">${s.rows.map((r,i)=>`<div class="br r" style="--i:${i+1}"><span class="bl">${esc(r.l)}</span><div class="bar"><i style="--w:${(r.v/s.max*100).toFixed(2)}%;--c:${r.c||'var(--ac)'};--i:${i}"></i></div><b class="bv">${esc(r.show)}</b></div>`).join('')}</div>${s.note?R(esc(s.note),5,'p','note'):''}</div>`,
 chart:s=>`<div class="in">${kick(s,0)}${R(esc(s.h),0,'h3')}<div class="cw r ${s.kind==='doughnut'?'sq':''}" style="--i:1"><canvas role="img" aria-label="${esc(s.h)}"></canvas></div>${s.note?R(esc(s.note),3,'p','note'):''}</div>`,
 pts:s=>T.flow(Object.assign({na:1},s)),
 flow:s=>`<div class="in c">${kick(s,0)}${R(esc(s.h),0,'h3')}<div class="fl${s.na?" na":""}">${s.steps.map((p,i)=>`${i&&!s.na?`<span class="ar r" style="--i:${i+1}">→</span>`:''}<div class="fs r" style="--i:${i+1}"><b>${esc(p.t)}</b><span>${esc(p.d||'')}</span></div>`).join('')}</div>${s.note?R(esc(s.note),5,'p','note'):''}</div>`,
 cmp:s=>`<div class="in">${R(esc(s.h),0,'h3')}<div class="cmp">${[s.l,s.r].map((p,pi)=>`<div class="cp ${pi?'no':'yes'} r" style="--i:${pi+1}"><h4>${esc(p.h)}</h4><ul>${p.items.map((t,k)=>`<li class="r" style="--i:${pi*3+k+2}">${esc(t)}</li>`).join('')}</ul></div>`).join('')}</div></div>`,
 chk:s=>`<div class="in">${kick(s,0)}${R(esc(s.h),0,'h3')}<div class="cks">${s.rows.map((r,i)=>`<div class="ck r" style="--i:${i+1}"><span class="mk ${r.m==='n'?'n':''}" style="--i:${i+1}">${r.m==='n'?'✕':'✓'}</span><div><b>${esc(r.t)}</b>${r.s?`<span class="s">${esc(r.s)}</span>`:''}</div></div>`).join('')}</div>${s.note?R(esc(s.note),6,'p','note'):''}</div>`,
 ill:s=>`<div class="in">${kick(s,0)}${R(esc(s.h),0,'h3')}${ILL[s.kind](s)}${cap(s,6)}</div>`,
 src:s=>`<div class="in sc">${R('출처',0,'h3')}${R(esc(s.ref),1,'p','ref')}${R(esc(s.status),2,'p','note')}${s.post?R(`<a href="${esc(s.post)}" target="_blank" rel="noopener">블로그 원본 글 보기 →</a>`,3,'p'):''}${R('인포그래픽 제작: donghunc.kr | AI 활용 블로그',4,'p','note')}</div>`
};

/* ---- charts (Chart.js) ---- */
const vl={id:'vl',afterDatasetsDraw(ch){const o=ch.options.plugins&&ch.options.plugins.vl;if(!o)return;const x=ch.ctx;x.save();x.fillStyle=o.color;x.font='700 '+o.size+'px '+o.font;x.textBaseline='middle';
  ch.data.datasets.forEach((d,di)=>{const m=ch.getDatasetMeta(di);m.data.forEach((b,i)=>{const t=d.show&&d.show[i];if(!t)return;
    if(ch.options.indexAxis==='y'){x.textAlign='left';x.fillText(t,b.x+10,b.y)}else{x.textAlign='center';x.fillText(t,b.x,d.data[i]<0?b.y+16:b.y-14)}})});x.restore()}};
function mkChart(cv,s,slide){if(typeof Chart==='undefined')return;
  const cs=getComputedStyle(document.documentElement),col=k=>(cs.getPropertyValue('--'+k).trim()||k),font='Pretendard Variable, Pretendard, sans-serif';
  const dn=s.kind==='doughnut';
  const ds=s.datasets.map(d=>({label:d.label,data:d.data,show:d.show,backgroundColor:Array.isArray(d.c)?d.c.map(col):col(d.c||'ac'),borderWidth:0,borderRadius:dn?0:8,borderSkipped:false,barPercentage:.6,categoryPercentage:.8}));
  const hz=s.axis==='y',val=hz?'x':'y',cat=hz?'y':'x';
  const opt={responsive:true,maintainAspectRatio:false,animation:{duration:RM?0:1800,easing:'easeOutQuart'},indexAxis:s.axis||'x',layout:{padding:{top:24,right:hz?70:8}},
    plugins:{legend:{display:!!s.legend,position:'bottom',labels:{color:col('fg2'),font:{family:font,size:14},usePointStyle:true,padding:18}},tooltip:{enabled:true,backgroundColor:col('tr'),titleColor:col('fg'),bodyColor:col('fg2'),borderColor:col('ln'),borderWidth:1,titleFont:{family:font},bodyFont:{family:font}},vl:{color:col('fg'),size:17,font}}};
  if(dn){opt.cutout='76%';opt.layout={padding:8};opt.plugins.vl=undefined}
  else{opt.scales={[cat]:{grid:{display:false},border:{display:false},ticks:{color:col('fg2'),font:{family:font,size:14}}},[val]:{display:false,min:s.min||0,max:s.max}}}
  const c=new Chart(cv,{type:s.kind==='line'?'line':(dn?'doughnut':'bar'),data:{labels:s.labels,datasets:ds},options:opt,plugins:[vl]});
  (slide._ch=slide._ch||[]).push(c)}

/* ---- count up ---- */
const fmt=(v,d)=>v.toLocaleString('ko-KR',{minimumFractionDigits:d,maximumFractionDigits:d});
function count(el){const to=+el.dataset.to,d=+el.dataset.dec,pre=el.dataset.pre||'';if(RM){el.textContent=pre+fmt(to,d);return}
  const t0=performance.now(),dur=1800;el.textContent=pre+fmt(0,d);
  (function f(t){const p=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-p,4);el.textContent=pre+fmt(to*e,d);if(p<1)requestAnimationFrame(f)})(t0)}

/* ---- build + navigate ---- */
const deck=$('#deck');
deck.innerHTML=D.slides.map((s,i)=>{SI=i;return `<section class="slide" aria-hidden="true" aria-label="${i+1} / ${D.slides.length}">${T[s.t](s)}</section>`}).join('');
const sl=$$('.slide',deck),N=sl.length;let cur=-1,timer=null;
const ap=$('#ap');
function enter(s,i){$$('.big[data-to]',s).forEach(count);$$('canvas',s).forEach(cv=>mkChart(cv,D.slides[i],s))}
function leave(s){(s._ch||[]).forEach(c=>c.destroy());s._ch=[]}
function go(i){i=Math.max(0,Math.min(N-1,i));if(i===cur)return;
  if(cur>=0){sl[cur].classList.remove('on');sl[cur].setAttribute('aria-hidden','true');leave(sl[cur])}
  cur=i;sl[i].classList.add('on');sl[i].setAttribute('aria-hidden','false');sl[i].scrollTop=0;enter(sl[i],i);
  $('#pg i').style.width=((i+1)/N*100)+'%';$('#ct').textContent=(i+1)+' / '+N;
  try{history.replaceState(null,'','#'+(i+1))}catch(e){}
  if(i===N-1)stop()}
const next=()=>go(cur+1),prev=()=>go(cur-1);
function stop(){if(timer){clearInterval(timer);timer=null}ap.setAttribute('aria-pressed','false');ap.textContent='▶ 자동 재생'}
function play(){stop();ap.setAttribute('aria-pressed','true');ap.textContent='❚❚ 정지';if(cur>=N-1)go(0);timer=setInterval(()=>{if(cur>=N-1)stop();else next()},12000)}
ap.addEventListener('click',e=>{e.stopPropagation();timer?stop():play()});
document.addEventListener('keydown',e=>{const k=e.key;
  if(k==='ArrowRight'||k==='PageDown'||k===' '||k==='Enter'){if(e.target===ap)return;e.preventDefault();next()}
  else if(k==='ArrowLeft'||k==='PageUp'){e.preventDefault();prev()}
  else if(k==='Home')go(0);else if(k==='End')go(N-1);
  else if(k==='a'||k==='A')timer?stop():play()});
deck.addEventListener('click',e=>{if(e.target.closest('a'))return;(e.clientX<innerWidth*.3)?prev():next()});
let tx=null;deck.addEventListener('touchstart',e=>{tx=e.touches[0].clientX},{passive:true});
deck.addEventListener('touchend',e=>{if(tx==null)return;const dx=e.changedTouches[0].clientX-tx;tx=null;if(Math.abs(dx)>50){dx<0?next():prev()}});
const h=parseInt((location.hash||'').slice(1),10);
requestAnimationFrame(()=>requestAnimationFrame(()=>{go(h>0&&h<=N?h-1:0);if(!RM&&!h)play()}));
})();
</script></body></html>
